<!DOCTYPE html>
<html>
<head>
    <title>Sentron Home</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">
    <style>
      /* minimal visual hint for active toggle */
      .toggle-wrap{display:flex;gap:12px;align-items:center;justify-content:center;margin-top:12px}
      .pill{padding:6px 12px;border:1px solid #ccc;border-radius:999px;cursor:pointer;background:#fff}
      .pill.active{background:#222;color:#fff;border-color:#222}
    </style>
</head>
<body>
    <div class="container mt-4 text-center">
        <h1 class="heading">📹 Live Feed - Sentron</h1>

        <!-- MODE TOGGLE -->
        <div class="toggle-wrap">
          <span>Mode:</span>
          <button class="pill" id="btn-face">Recognition</button>
          <button class="pill" id="btn-violence">Violence</button>
          <span id="mode-label" style="margin-left:8px;opacity:0.7;">Current: {{ mode|default('face') }}</span>
        </div>

        <!-- give the stream an id so we can refresh it after switching -->
        <img id="stream" src="{{ url_for('video_feed') }}" class="video-feed mt-3 mb-3" alt="Live Video Feed">

        <!-- Manual snapshot capture button -->
        <button class="btn capture-btn">Capture Snapshot</button>

        <div class="d-flex justify-content-center mt-4 gap-3">
            <div class="button-box">
                <a href="{{ url_for('threats') }}">
                    <button class="btn">⚠️ View Threat Log</button>
                </a>
            </div>
            <div class="button-box">
                <a href="{{ url_for('snapshots') }}">
                    <button class="btn">📸 View Snapshots</button>
                </a>
            </div>
            <div class="button-box">
                <a href="{{ url_for('recent') }}">
                    <button class="btn">🧠 Recent Recognitions</button>
                </a>
            </div>
            <div class="button-box">
                <a href="{{ url_for('logout') }}">
                    <button class="btn">🔓 Logout</button>
                </a>
            </div>
        </div>
    </div>

    <!-- Toast container -->
    <div id="toast-container"></div>

    <script>
document.addEventListener('DOMContentLoaded', () => {
  const captureBtn = document.getElementById('capture-btn');

  // existing…
  const current = "{{ mode|default('face') }}";
  const btnFace = document.getElementById('btn-face');
  const btnViolence = document.getElementById('btn-violence');
  const modeLabel = document.getElementById('mode-label');

  let currentMode = current; // track mode on the client

  function setActive(mode) {
    currentMode = mode;
    btnFace.classList.toggle('active', mode === 'face');
    btnViolence.classList.toggle('active', mode === 'violence');
    modeLabel.textContent = "Current: " + mode;
    // update button label based on mode
    captureBtn.textContent = (mode === 'violence') ? 'Capture Violence' : 'Capture Snapshot';
  }
  setActive(current);

  // click -> send right threat type depending on mode
  captureBtn.addEventListener('click', (event) => {
    event.preventDefault();
    const threat = (currentMode === 'violence') ? 'fight' : 'unknown';
    fetch('/capture_snapshot/' + threat)
      .then(res => res.ok ? showToast('📸 Snapshot captured!') : showToast('❌ Failed to capture.', 'error'))
      .catch(() => showToast('❌ Error capturing snapshot.', 'error'));
  });

  async function switchMode(mode) {
    try {
      const res = await fetch("{{ url_for('switch_mode') }}", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ mode })
      });
      const data = await res.json();
      if (!data.ok) throw new Error("Failed to switch mode");
      setActive(data.mode);

      // refresh stream
      const img = document.getElementById('stream');
      img.src = img.src.split('?')[0] + '?t=' + Date.now();
    } catch (e) {
      showToast('❌ ' + e.message, 'error');
    }
  }

  btnFace.addEventListener('click', () => switchMode('face'));
  btnViolence.addEventListener('click', () => switchMode('violence'));
});

// your showToast() stays the same
</script>
