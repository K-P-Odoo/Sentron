<!DOCTYPE html>
<html>
<head>
    <title>Sentron Home</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container mt-4 text-center">
        <h1 class="heading">📹 Live Feed - Sentron</h1>
        <img src="{{ url_for('video_feed') }}" class="video-feed mt-3 mb-3" alt="Live Video Feed">

        <!-- Manual snapshot capture button -->
        <button class="btn capture-btn">Capture Snapshot</button>

        <div class="d-flex justify-content-center mt-4 gap-3">
            <div class="button-box">
                <a href="{{ url_for('threats') }}">
                    <button class="btn">⚠️ View Threat Log</button>
                </a>
            </div>
            <div class="button-box">
                <a href="{{ url_for('snapshots') }}">
                    <button class="btn">📸 View Snapshots</button>
                </a>
            </div>
            <div class="button-box">
                <a href="{{ url_for('recent') }}">
                    <button class="btn">🧠 Recent Recognitions</button>
                </a>
            </div>
            <div class="button-box">
                <a href="{{ url_for('logout') }}">
                    <button class="btn">🔓 Logout</button>
                </a>
            </div>
        </div>
    </div>

    <!-- Toast container -->
    <div id="toast-container"></div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        document.querySelectorAll('.capture-btn').forEach(button => {
            button.addEventListener('click', function(event) {
                event.preventDefault();

                fetch('/capture_snapshot/unknown')
                    .then(response => {
                        if (response.ok) {
                            showToast('📸 Snapshot captured!');
                        } else {
                            showToast('❌ Failed to capture snapshot.', 'error');
                        }
                    })
                    .catch(error => {
                        console.error('Fetch error:', error);
                        showToast('❌ Error capturing snapshot.', 'error');
                    });
            });
        });
    });

    function showToast(message, type = 'success') {
        const container = document.getElementById('toast-container');
        if (!container) return;

        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        toast.innerText = message;
        container.appendChild(toast);

        setTimeout(() => {
            toast.classList.add('fade-out');
            toast.addEventListener('transitionend', () => toast.remove());
        }, 3000);
    }
    </script>
</body>
</html>
